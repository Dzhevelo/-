<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Волк и Падающие Яйца 📱</title>
    <style>
        :root {
            --bg-color: #8bc34a;       /* Зеленый луг */
            --wolf-color: #3e2723;     /* Темно-коричневый волк */
            --egg-color: #fff;         /* Белое яйцо */
            --bomb-color: #d32f2f;     /* Красная бомба */
            --text-color: #2e7d32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Запрещаем скролл страницы */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        /* Контейнер игры */
        #game-container {
            position: relative;
            width: 95vw;
            max-width: 400px;
            height: 85vh;
            max-height: 700px;
            background: #c8e6c9; /* Цвет неба */
            border: 6px solid #2e7d32;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            touch-action: none; /* Отключаем зум на телефоне */
        }

        /* Интерфейс (счет и жизни) */
        .ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* Волк */
        #wolf {
            position: absolute;
            bottom: 30px; /* Фиксируем внизу */
            left: 50%;
            transform: translateX(-50%);
            width: 70px;   /* Размер под палец */
            height: 80px;
            background-color: var(--wolf-color);
            border-radius: 50% 50% 20% 20%;
            z-index: 5;
            animation: blink 3s infinite;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
        }
        
        /* Уши волка */
        #wolf::before, #wolf::after {
            content: "";
            position: absolute;
            top: -20px;
            width: 25px;
            height: 40px;
            background-color: var(--wolf-color);
            z-index: 6;
        }
        #wolf::before { left: -15px; border-radius: 50% 0 0 0; transform: rotate(-30deg); }
        #wolf::after { right: -15px; border-radius: 0 50% 0 0; transform: rotate(30deg); }

        @keyframes blink {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.5; }
        }

        /* Яйцо (падает сверху) */
        .egg {
            position: absolute;
            bottom: 100%; /* Изначально за пределами экрана сверху */
            width: 50px;
            height: 60px;
            background-color: var(--egg-color);
            border-radius: 50% / 60%;
            box-shadow: inset -5px -5px 10px rgba(255,255,255,0.4), 4px 4px 0px rgba(0,0,0,0.1);
            z-index: 2;
            pointer-events: none;
        }

        /* Бомба (падает сверху) */
        .bomb {
            position: absolute;
            bottom: 100%;
            width: 50px;
            height: 50px;
            background-color: var(--bomb-color);
            border-radius: 50%;
            box-shadow: 0 4px 0 rgba(100,0,0,0.5), inset -2px -2px 5px rgba(0,0,0,0.3);
            z-index: 2;
            animation: fuse 1s infinite;
            pointer-events: none;
        }

        .bomb::after {
            content: "";
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%) rotate(-45deg);
            width: 10px; height: 3px;
            background: white;
            box-shadow: 0 0 2px black;
        }

        @keyframes fuse {
            0% { transform: scale(1) rotate(-45deg); opacity: 1; }
            50% { transform: scale(0.95) rotate(-35deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(-45deg); opacity: 1; }
        }

        /* Экран конца игры */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        h1.title { color: #ffeb3b; font-size: 28px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p.score-text { color: white; font-size: 42px; font-weight: bold; margin: 10px 0; text-shadow: 2px 2px 0px #000; }

        button.restart-btn {
            padding: 18px 40px;
            font-size: 20px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        button.restart-btn:active { transform: scale(0.96); }

        /* Панель управления (кнопки) */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .control-btn:active, .control-btn.pressed {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }

        /* Зона для свайпа пальцем */
        #swipe-zone {
            position: absolute;
            top: 0; bottom: 100px; /* Оставляем место под кнопки */
            left: 0; right: 0;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Интерфейс -->
        <div class="ui-layer">
            <span id="score">Счёт: 0</span>
            <span id="lives">❤️ ❤️ ❤️</span>
        </div>

        <!-- Волк -->
        <div id="wolf"></div>

        <!-- Зона свайпа -->
        <div id="swipe-zone"></div>

        <!-- Кнопки управления -->
        <div class="mobile-controls">
            <div class="control-btn" id="btn-left" onclick="moveWolf(-15)">←</div>
            <div class="control-btn" id="btn-right" onclick="moveWolf(15)">→</div>
        </div>

        <!-- Экран проигрыша -->
        <div id="game-over-screen">
            <h1 class="title">Игра окончена!</h1>
            <p class="score-text" id="final-score">0</p>
            <button class="restart-btn" onclick="restartGame()">Играть снова</button>
            <div style="color: rgba(255,255,255,0.7); margin-top: 20px; font-size: 14px;">
                Лови яйца сверху!
            </div>
        </div>
    </div>

    <script>
        const wolf = document.getElementById('wolf');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const swipeZone = document.getElementById('swipe-zone');

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let spawnInterval;
        
        // Позиция волка в процентах (от 0 до 100)
        let wolfPos = 50; 
        
        // Ширина волка в процентах (примерно 18% от ширины контейнера)
        const WOLF_WIDTH_PERCENT = 18; 

        // --- Управление кнопками ---
        function moveWolf(delta) {
            if (!gameRunning) return;
            wolfPos += delta;
            clampWolfPosition();
            updateWolfVisual();
        }

        function clampWolfPosition() {
            // Ограничиваем, чтобы волк не уходил за края экрана
            if (wolfPos < 5) wolfPos = 5;
            if (wolfPos > 82) wolfPos = 82; // 100 - 18 (ширина) = 82
        }

        function updateWolfVisual() {
            wolf.style.left = wolfPos + '%';
        }

        // --- Управление свайпом (для телефона) ---
        let startX = 0;

        swipeZone.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        swipeZone.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            const currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            
            // Если сдвинули достаточно сильно (> 30px), двигаем волка
            if (Math.abs(diff) > 30) {
                const moveAmount = diff > 0 ? 10 : -10; 
                wolfPos += moveAmount;
                clampWolfPosition();
                updateWolfVisual();
                startX = currentX; // Обновляем точку старта для плавности
            }
        });

        // --- Логика игры (СПАВН И ПАДЕНИЕ) ---
        function spawnObjects() {
            const container = document.getElementById('game-container');
            
            // 70% шанс на яйцо, 30% на бомбу
            const isBomb = Math.random() > 0.7;
            const typeClass = isBomb ? 'bomb' : 'egg';
            
            const obj = document.createElement('div');
            obj.className = typeClass;
            
            // Случайная позиция X (от 15% до 85%)
            const startX = Math.floor(Math.random() * 70) + 15;
            obj.style.left = startX + '%';
            
            container.appendChild(obj);

            // Начальная позиция: за пределами экрана сверху
            let currentY = -60; 
            
            // Скорость падения: базовая + ускорение от счета
            let fallSpeed = 8 + (score * 0.2); 

            const fallLoop = setInterval(() => {
                currentY += fallSpeed;
                obj.style.bottom = currentY + 'px';

                // ПРОВЕРКА СТОЛКНОВЕНИЯ (ГЛАВНОЕ ИЗМЕНЕНИЕ)
                checkCollision(obj, startX, isBomb);

                // Если объект упал вниз экрана - удаляем его
                if (currentY > 700) { 
                    clearInterval(fallLoop);
                    obj.remove();
                }
            }, 16); // ~60 FPS
        }

        function checkCollision(obj, objX, isBomb) {
            // Вычисляем границы волка
            const wolfLeft = wolfPos;
            const wolfRight = wolfPos + WOLF_WIDTH_PERCENT;
            
            // Проверяем, находится ли центр падающего объекта над волком
            // Добавляем небольшой допуск (+/- 5%) для удобства ловли
            const tolerance = 5; 
            const objectCenter = objX; // Центр объекта

            if (objectCenter >= (wolfLeft - tolerance) && objectCenter <= (wolfRight + tolerance)) {
                
                // Дополнительная проверка: объект должен быть достаточно низко, чтобы считаться "пойманным"
                // (например, когда он почти касается головы волка)
                if (currentY >= 110) { // Примерно высота волка + немного сверху
                    
                    if (isBomb) {
                        lives--;
                        updateLives();
                    } else {
                        score++;
                        updateScore();
                    }

                    obj.remove(); // Удаляем объект
                    
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        // Глобальная переменная для доступа внутри checkCollision (так как она внутри setInterval)
        // Чтобы не усложнять код, я вынесла логику проверки чуть иначе ниже, но здесь оставлю упрощенную версию:
        // Мы передаем currentY через замыкание или делаем его доступным. 
        // Исправление: сделаем currentY доступным для проверки высоты.
        
        // ПЕРЕПИСАННАЯ ФУНКЦИЯ СПАВНА ДЛЯ ДОСТУПА К currentY
        function spawnObjectsFixed() {
            const container = document.getElementById('game-container');
            const isBomb = Math.random() > 0.7;
            const typeClass = isBomb ? 'bomb' : 'egg';
            const obj = document.createElement('div');
            obj.className = typeClass;
            const startX = Math.floor
